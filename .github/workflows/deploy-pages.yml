name: Deploy Voici Site to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip voici jupyterlite-xeus

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v2

      - name: Build static site
        run: |
          voici build --lite-dir . --output-dir _site --contents vste_gold_and_oil.ipynb --VoilaConfiguration.language_kernel_mapping=python=xpython
          touch _site/.nojekyll

      - name: Verify kernel configuration
        run: |
          test -f _site/jupyter-lite.json
          python - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path("_site/jupyter-lite.json").read_text(encoding="utf-8"))
          kernel = cfg.get("jupyter-config-data", {}).get("defaultKernelName")
          print("defaultKernelName:", kernel)
          if not kernel:
              raise SystemExit("No defaultKernelName found in _site/jupyter-lite.json")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
